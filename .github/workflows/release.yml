# Порядок работы агента и публикации: docs/releasing.md.
name: Release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-git-flow.mjs
      - name: Выпускается только коммит из master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Описание выпуска из релизного PR
        id: notes
        run: |
          version=$(node -p "require('./package.json').version")
          notes="docs/releases/v$version.md"
          test -s "$notes"
          grep -q '[^[:space:]]' "$notes"
          cp "$notes" release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  package:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Обе mac-архитектуры в одной job: electron-builder объединяет latest-mac.yml.
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: user.name
          GIT_CONFIG_VALUE_0: orca-board CI
          GIT_CONFIG_KEY_1: user.email
          GIT_CONFIG_VALUE_1: ci@orca-board.invalid
          GIT_CONFIG_KEY_2: core.autocrlf
          GIT_CONFIG_VALUE_2: 'false'
          GIT_CONFIG_KEY_3: safe.directory
          GIT_CONFIG_VALUE_3: ''
      # Секреты получает только macOS-упаковка. Hook отклоняет отсутствующие credentials,
      # чужую Team и ad-hoc; встроенный builder notarize/staple .app, hook завершает DMG.
      - name: Подпись, notarization и проверка финальных macOS-артефактов
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @orca-board/desktop exec electron-builder --mac --publish never
          node scripts/verify-macos-release.mjs
      # На Windows собираем нативно с npmRebuild из electron-builder.yml, без Apple secrets.
      - if: matrix.platform == 'win'
        run: pnpm --filter @orca-board/desktop exec electron-builder --win --publish never
      - name: Диагностика notarization DMG (не файлы релиза)
        if: always() && matrix.platform == 'mac'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-notarization
          path: apps/desktop/release/notarization/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Проверить комплект, создать контрольные суммы и загрузить черновик
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cp notes/release-notes.md installers/RELEASE_NOTES.md
          cd installers
          files=(
            latest.yml latest-mac.yml
            "orca-board-$RELEASE_VERSION-arm64.zip" "orca-board-$RELEASE_VERSION-arm64.zip.blockmap"
            "orca-board-$RELEASE_VERSION-x64.zip" "orca-board-$RELEASE_VERSION-x64.zip.blockmap"
            "orca-board-$RELEASE_VERSION-arm64.dmg" "orca-board-$RELEASE_VERSION-x64.dmg"
            "orca-board-$RELEASE_VERSION-x64.exe" "orca-board-$RELEASE_VERSION-x64.exe.blockmap"
            "orca-board-$RELEASE_VERSION-portable-x64.exe" RELEASE_NOTES.md
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "::error::Нет непустого файла $file"; exit 1; }
          done
          # Stapling изменяет DMG. Его metadata отключена; updater использует ZIP.
          for file in *.dmg.blockmap; do
            if [ -f "$file" ]; then echo "::error::Недопустимый DMG blockmap: $file"; exit 1; fi
          done
          if grep -q '\.dmg' latest-mac.yml; then echo '::error::DMG в update manifest'; exit 1; fi
          for manifest in latest.yml latest-mac.yml; do
            grep -qxF "version: $RELEASE_VERSION" "$manifest"
          done
          for arch in arm64 x64; do
            grep -qxF "  - url: orca-board-$RELEASE_VERSION-$arch.zip" latest-mac.yml
          done
          grep -qxF "  - url: orca-board-$RELEASE_VERSION-x64.exe" latest.yml
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          files+=(SHA256SUMS)

          # Сбой API не принимаем за отсутствие релиза; опубликованное и дубли не перезаписываем.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | {id, draft}' | jq -s . > ../releases.json
          count=$(jq length ../releases.json)
          if [ "$count" -eq 0 ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "orca-board $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
          else
            test "$count" -eq 1
            test "$(jq -r '.[0].draft' ../releases.json)" = true
            gh release edit "$RELEASE_TAG" --draft=true --title "orca-board $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          # Проверяем ответ GitHub после загрузки, а не только файлы на runner.
          gh release view "$RELEASE_TAG" --json isDraft,assets > ../uploaded.json
          test "$(jq -r .isDraft ../uploaded.json)" = true
          for file in "${files[@]}"; do
            size=$(wc -c < "$file")
            jq -e --arg name "$file" --argjson size "$size" \
              'any(.assets[]; .name == $name and .size == $size and .state == "uploaded")' ../uploaded.json > /dev/null
          done
          echo "Черновик готов: https://github.com/$GH_REPO/releases"
