<script>
// ---------- пример данных в форме ProjectStats (контракт dee2db9) ----------
const DAY = 86400000;
const NOW = new Date('2026-09-24T15:00:00').getTime();
const SERIES = { 'claude-opus-5-5': 'var(--s1)', 'claude-sonnet-5': 'var(--s2)', 'gpt-5.5-codex': 'var(--s3)', 'claude-haiku-4-5': 'var(--s4)', unknown: 'var(--s-unknown)' };
const ROLE_C = { coordinator: 'var(--s1)', developer: 'var(--s2)', designer: 'var(--s4)', reviewer: 'var(--s3)', qa: 'var(--s5)' };

function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const r = rnd(7);
// 30 дней по дням; нескольких дней нет — в byDay их нет (контракт)
const DAYS = [];
for (let i = 29; i >= 0; i--) {
  const d = new Date(NOW - i * DAY);
  const wd = d.getDay();
  if ((wd === 0 || wd === 6) && r() < .75) continue;
  const act = .35 + r() * 1.1 + (i < 6 ? .5 : 0);
  const opus = +(act * (8 + r() * 6)).toFixed(2), sonnet = +(act * (2 + r() * 3)).toFixed(2), codex = +(act * r() * 2.2).toFixed(2);
  DAYS.push({ date: d.toISOString().slice(0, 10), byModel: { 'claude-opus-5-5': opus, 'claude-sonnet-5': sonnet, 'gpt-5.5-codex': codex },
    tokens: Math.round((opus + sonnet + codex) * 520000), agentMs: Math.round(act * (3.2 + r() * 2) * 3600000), tasksDone: Math.round(act * 2.4 * r() + (r() > .5 ? 1 : 0)) });
}

const ROWS = {
  role: [
    { key: 'developer', title: 'Разработчик', cost: 212.4, tokens: 118.2e6, sessions: 61, withUsage: 58, agentMs: 71.5 * 3600000 },

const k = () => RANGE_K[S.range];

function money(v) { if (v == null) return null; const x = v * k(); return '$' + (x >= 100 ? Math.round(x).toLocaleString('ru-RU') : x.toFixed(2).replace('.', ',')); }
function tok(v) { if (v == null) return null; const x = v * k(); if (x >= 1e9) return (x / 1e9).toFixed(2).replace('.', ',') + ' млрд'; if (x >= 1e6) return (x / 1e6).toFixed(1).replace('.', ',') + ' млн'; if (x >= 1e3) return Math.round(x / 1e3) + ' тыс'; return String(Math.round(x)); }
function dur(ms, scale = true) { const x = scale ? ms * k() : ms; const h = Math.floor(x / 3600000), m = Math.round((x % 3600000) / 60000); if (h >= 100) return h + ' ч'; return h ? `${h} ч ${m} мин` : `${m} мин`; }
function cnt(n) { return Math.round(n * k()); }
const NA = '<span class="unknown" title="Нет транскриптов этих сессий — агент не пишет токены или файл удалён">нет данных</span>';
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const RANGE_LABEL = { '7d': '7 дней', '30d': '30 дней', all: 'всё время' };

function days() {
  const n = S.range === '7d' ? 7 : 30;

}

function rowUsage(row) { return noTokens() ? { ...row, cost: null, tokens: null, withUsage: 0 } : row; }
// main сортирует строки: стоимость → токены → время агентов, по убыванию
function rowsOf(kind) { return ROWS[kind].map(rowUsage).sort((a, b) => (b.cost ?? -1) - (a.cost ?? -1) || (b.tokens ?? -1) - (a.tokens ?? -1) || b.agentMs - a.agentMs); }

// столбики по дням: стек по моделям (стоимость) или одна серия (токены / время / задачи)
function dayChart(metric = 'cost', h = 170) {
  const ds = days();
  if (noTokens() && (metric === 'cost' || metric === 'tokens')) metric = 'time';
  const W = 640, H = h, pl = 44, pr = 8, pt = 8, pb = 22;
  const n = S.range === '7d' ? 7 : 30;
  const val = (d) => metric === 'cost' ? Object.values(d.byModel).reduce((a, b) => a + b, 0) : metric === 'tokens' ? d.tokens : metric === 'time' ? d.agentMs / 3600000 : d.tasksDone;
  const max = Math.max(...ds.map(val), 1);
  const step = niceStep(max / 4);
  const top = Math.ceil(max / step) * step;
  const y = (v) => pt + (H - pt - pb) * (1 - v / top);
  const slot = (W - pl - pr) / n, bw = Math.max(4, Math.min(22, slot - 6));
  const fmtAx = (v) => metric === 'cost' ? '$' + v : metric === 'tokens' ? (v / 1e6) + ' млн' : metric === 'time' ? v + ' ч' : v;
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${fmtAx(+v.toFixed(2))}</text>`;
  const start = NOW - (n - 1) * DAY;
  let bars = '';
  for (let i = 0; i < n; i++) {
    const date = new Date(start + i * DAY).toISOString().slice(0, 10);
    const d = ds.find((x) => x.date === date);
    const x = pl + i * slot + (slot - bw) / 2;
    if ((n === 7 || i % 5 === 4 || i === n - 1)) bars += `<text class="ax" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${+date.slice(8)}.${date.slice(5, 7)}</text>`;
    if (!d) continue;
    let inner = `<rect class="hover-bg" x="${pl + i * slot}" y="${pt}" width="${slot}" height="${H - pt - pb}" fill="transparent"/>`;
    if (metric === 'cost') {
      let acc = 0;
      const parts = Object.entries(d.byModel);
      parts.forEach(([m, v], j) => {
        const y0 = y(acc), y1 = y(acc + v); acc += v;
        const gap = j > 0 ? 1 : 0;
        const hh = Math.max(0, y0 - y1 - gap);
        const last = j === parts.length - 1;
        inner += last ? `<path class="bar" fill="${SERIES[m]}" d="${roundTop(x, y0 - gap - hh, bw, hh)}"/>` : `<rect class="bar" fill="${SERIES[m]}" x="${x}" y="${y0 - gap - hh}" width="${bw}" height="${hh}"/>`;
      });
    } else {
      const v = val(d); const hh = y(0) - y(v);
      inner += `<path class="bar" fill="var(--accent)" d="${roundTop(x, y(v), bw, hh)}"/>`;
    }
    bars += `<g class="d" data-day="${date}" data-metric="${metric}">${inner}</g>`;
  }
  const legend = metric === 'cost' ? `<div class="legend">${Object.keys(DAYS[0].byModel).map((m) => `<span><i class="swatch" style="background:${SERIES[m]}"></i>${m}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="По дням: ${metric}">${g}<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--chip)"/>${bars}</svg></div>${legend}`;
}
function roundTop(x, y, w, h) { const r = Math.min(4, h, w / 2); if (h <= 0) return ''; return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

const BREAKDOWNS = [['role', 'Роли'], ['model', 'Модели'], ['agent', 'Агенты'], ['global', 'Глобальные задачи'], ['task', 'Задачи']];
function breakdownTabs() { return `<div class="subtabs" role="tablist">${BREAKDOWNS.map(([id, l]) => `<button role="tab" aria-selected="${S.breakdown === id}" class="${S.breakdown === id ? 'on' : ''}" data-bd="${id}">${l}</button>`).join('')}</div>`; }

function nameCell(kind, row) {
  let lead = '';
  if (kind === 'role') lead = `<i class="swatch" style="background:${ROLE_C[row.key]}"></i>`;
  if (kind === 'model') lead = `<i class="swatch" style="background:${SERIES[row.key] || 'var(--s-unknown)'}"></i>`;
  if (kind === 'agent') lead = `<span class="logo lg-${row.key}">${row.key[0].toUpperCase()}</span>`;
  if (kind === 'global' || kind === 'task') lead = `<i class="swatch" style="background:var(--col-${row.status});border-radius:50%" title="${COLS.find((c) => c[0] === row.status)[1]}"></i>`;
  const cls = row.key === 'unknown' ? ' unknown' : '';
  const sub = kind === 'model' ? ` <span class="hint">${row.agent}</span>` : '';
  return `<div class="nm">${lead}<span class="x${cls}">${esc(row.title)}</span>${sub}</div>`;
}

const COL_HEAD = { role: 'Роль', model: 'Модель', agent: 'Агент', global: 'Глобальная задача', task: 'Задача' };
function breakdownTable(kind, compact = false) {
  const rows = rowsOf(kind);
  const maxCost = Math.max(...rows.map((x) => x.cost || 0), 1);
  const maxT = Math.max(...rows.map((x) => x.agentMs));
  const byCost = !noTokens();
  const body = rows.map((row) => {
    const share = byCost ? (row.cost || 0) / maxCost : row.agentMs / maxT;
    const cost = row.cost == null ? (row.tokens != null && row.unpriced ? '<span class="chip warn" title="Модели нет в таблице цен">цена неизвестна</span>' : NA) : money(row.cost) + (row.unpriced ? ' <span class="hint" title="Часть токенов — модели без цены">+?</span>' : '');
    const partial = row.withUsage < row.sessions && row.withUsage > 0 ? ` <span class="hint" title="Сессий с данными о токенах">(${row.withUsage}/${row.sessions})</span>` : '';
    return `<tr><td class="t">${nameCell(kind, row)}</td>
      <td class="r">${cost}</td>
      ${compact ? '' : `<td class="r">${row.tokens == null ? NA : tok(row.tokens)}${partial}</td>`}
      <td class="r">${dur(row.agentMs)}</td>
      ${compact ? '' : `<td class="r">${cnt(row.sessions)}</td>`}
      <td style="width:18%"><div class="share" aria-hidden="true"><i style="width:${Math.max(2, share * 100)}%"></i></div></td></tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="st"><thead><tr><th>${COL_HEAD[kind]}</th>
    <th class="r">Стоимость</th>${compact ? '' : '<th class="r">Токены</th>'}<th class="r">Время агентов</th>${compact ? '' : '<th class="r">Сессии</th>'}<th title="Доля ${byCost ? 'стоимости' : 'времени агентов'}">доля</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

    const max = Math.max(...rows.map((x) => x[key] || 0), 1);
    return `<div class="split-list">${rows.map((row) => `<div class="it"><div class="n">${nameCell(kind, row).replace('<div class="nm">', '').replace(/<\/div>$/, '')}</div>
      <b class="num" style="font-weight:500">${noTokens() ? dur(row.agentMs) : row.cost == null ? (row.unpriced ? '<span class="chip warn">без цены</span>' : NA) : money(row.cost)}</b>
      <div class="share"><i style="width:${Math.max(2, (row[key] || 0) / max * 100)}%;background:${kind === 'model' ? SERIES[row.key] || 'var(--s-unknown)' : kind === 'role' ? ROLE_C[row.key] : 'var(--accent)'}"></i></div></div>`).join('')}</div>`;
  };
  return head('stats') + `<div class="content"><div class="dash">
    <div class="dash-top"><span class="muted">Обновлено в 15:00 · считается по запросу, не хранится</span><span class="grow"></span>${periodCtl()}</div>
    <section class="panel"><div class="hero">
      <div class="big"><span class="muted">Потрачено за ${RANGE_LABEL[S.range]}</span><span class="v">${c.v}</span><span class="hint">${c.sub}</span>
        <div class="facts">
          <div><span>Токены</span><b class="num">${noTokens() ? NA : tok(t.input + t.output + t.cacheRead + t.cacheWrite)}</b></div>
          <div><span>Время агентов</span><b class="num">${dur(TOTALS.agentMs)}</b></div>
          <div><span>Задач завершено</span><b class="num">${cnt(TASKS.done)}</b></div>
          <div><span>Цена задачи</span><b class="num">${noTokens() ? NA : money(TOTALS.cost / TASKS.done / k())}</b></div>
        </div></div>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="muted" style="flex:1">По дням</span>
          <div class="subtabs">${metrics.map(([id, l]) => `<button class="${metric === id ? 'on' : ''}" data-metric="${id}">${l}</button>`).join('')}</div></div>
        ${dayChart(metric, 190)}</div>
    </div></section>
    ${unknownNotice()}
    <div class="grid-b">
      <section class="panel"><h3>Модели</h3>${split('model')}</section>
      <section class="panel"><h3>Роли</h3>${split('role')}</section>
      <section class="panel"><h3>Задачи на доске</h3>${statusBar()}<div class="hint">Прогоны за период</div>${dispatchFacts()}
        <div class="muted">В работе в среднем <b>${dur(TASKTIME.avgActiveMs, false)}</b>, от старта до «Готово» — <b>${dur(TASKTIME.avgLeadMs, false)}</b></div></section>
    </div>
    <div class="grid-b2">
      <section class="panel"><h3>Самые дорогие глобальные задачи</h3>${breakdownTable('global', true)}</section>
      <section class="panel"><h3>Самые дорогие задачи</h3>${breakdownTable('task', true)}</section>
    </div>
  </div></div>`;
}

function variantC() {
  const ds = days();
  const sp = ds.map((d) => noTokens() ? d.agentMs : Object.values(d.byModel).reduce((a, b) => a + b, 0));
  const mx = Math.max(...sp, 1);
  const spark = sp.length ? `<svg class="spark" viewBox="0 0 90 22" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${sp.map((v, i) => `${(i / Math.max(1, sp.length - 1) * 86 + 2).toFixed(1)},${(20 - v / mx * 17).toFixed(1)}`).join(' ')}"/></svg>` : '';
  const cards = {
    progress: [['Статистика проекта: сбор токенов из транскриптов', 'developer', 'claude', 4.1], ['Статистика проекта: раздел в UI', 'designer', 'claude', null]],
    review: [['Статистика проекта: контракт (типы, IPC, источники данных)', 'developer', 'claude', 22.9]],
    ready: [['Таблица цен MODEL_PRICES и неизвестные модели', 'developer', 'codex', null]],
    done: [['История статусов задачи: блок в карточке (renderer)', 'designer', 'claude', 16.3], ['Проверка ветки: запросы к человеку', 'qa', 'gemini', 'na']],
  };
  const colTitle = { ready: 'Готово к работе', progress: 'В работе', review: 'На проверке', done: 'Готово' };
  const card = ([t, role, ag, cost]) => `<div class="tcard"><div class="ttl">${esc(t)}</div><div class="meta"><span class="logo lg-${ag}">${ag[0].toUpperCase()}</span>${role}
    <span class="cost" title="Расход агентов на задаче за всё время">${cost === 'na' || (noTokens() && cost) ? '<span class="unknown">$ —</span>' : cost == null ? '' : '$' + cost.toFixed(2).replace('.', ',')}</span></div></div>`;
  const strip = isEmpty() ? `<div class="stat-strip">За ${RANGE_LABEL[S.range]} агенты не запускались<span class="grow"></span>${periodCtl()}</div>` : `<div class="stat-strip" role="group" aria-label="Статистика за период">
      <span>За ${RANGE_LABEL[S.range]}</span>
      <span>${noTokens() ? 'стоимость ' + NA : `<b>${money(TOTALS.cost)}</b><span title="Не менее: у deepseek-v4 нет цены">+</span>`}</span>
      <span>${noTokens() ? '' : `<b>${tok(TOTALS.tokens.input + TOTALS.tokens.output + TOTALS.tokens.cacheRead + TOTALS.tokens.cacheWrite)}</b> ток.`}</span>
      <span>агенты <b>${dur(TOTALS.agentMs)}</b></span>
      <span>готово <b>${cnt(TASKS.done)}</b></span>${spark}
      <span class="grow"></span>
      <button class="open ${S.drawer ? 'on' : ''}" data-drawer aria-expanded="${S.drawer}"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M4 20V10M10 20V4M16 20v-7"/></svg>Подробнее</button></div>`;
  const drawer = S.drawer && !isEmpty() ? `<aside class="drawer" aria-label="Статистика проекта">
    <div class="dh"><h3>Статистика</h3><button class="x" data-drawer aria-label="Закрыть"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    ${periodCtl()}
    ${kpis()}
    ${unknownNotice()}
    <section class="panel"><h3>По дням</h3>${dayChart('cost', 150)}</section>
    ${BREAKDOWNS.map(([id, l], i) => `<details class="acc" ${i < 2 ? 'open' : ''}><summary>${l}<span class="hint">${ROWS[id].length}</span></summary>${breakdownTable(id, true)}</details>`).join('')}
    <details class="acc"><summary>Задачи и прогоны</summary>${statusBar()}${dispatchFacts()}</details>
  </aside>` : '';
  return head('board') + `<div class="content"><div class="board-wrap"><div class="board-area">${strip}
    <div class="board">${['ready', 'progress', 'review', 'done'].map((c) => `<div class="col"><h4><span class="dot" style="background:var(--col-${c})"></span>${colTitle[c]}<span class="c">${cards[c].length}</span></h4>${cards[c].map(card).join('')}</div>`).join('')}</div>
    <div class="hint">Стоимость на карточке — сумма <code>byTask</code> за всё время; в карточке задачи — блок «Расход» с разбивкой по прогонам.</div>
    </div>${drawer}</div></div>`;
}

const NOTES = {
  a: `<div><b>A · Раздел «Статистика» в «О проекте».</b> Ещё один пункт в меню разделов рядом с «Прогонами». Итоги плитками, график по дням, разбивка таблицей с переключателем «Роли / Модели / Агенты / Глобальные / Задачи».</div>
      <div><span class="pro">+</span> ни одной новой вкладки, тот же каркас, что у соседних разделов; все пять разбивок контракта в одной таблице.<br><span class="con">−</span> статистику надо искать; на узком окне меню разделов прячется.</div>`,
  b: `<div><b>B · Вкладка «Статистика» у проекта.</b> Отдельная вкладка рядом с «Доской» и «Терминалами» — дашборд на всю ширину: главная цифра, график с выбором метрики, доли моделей и ролей, топ дорогих задач.</div>
      <div><span class="pro">+</span> видно с первого взгляда, место под графики и «куда ушли деньги».<br><span class="con">−</span> новая вкладка в шапке; разбивки по агентам и дням — только частично, остальное — в таблицах ниже.</div>`,
  c: `<div><b>C · По месту: полоса над доской + панель.</b> Строка-сводка над доской (стоимость, токены, время, готово, тренд) и выезжающая справа панель с деталями; расход задачи — прямо на её карточке.</div>
      <div><span class="pro">+</span> цифры всегда на глазах, цена видна у каждой задачи; доска не уходит.<br><span class="con">−</span> панель тесная для таблиц; полоса занимает высоту доски.</div>`,
};

// ---------- отрисовка и события ----------
function seg(id, key, opts) {
  document.getElementById(id).innerHTML = opts.map(([v, l]) => `<button class="${S[key] === v ? 'on' : ''}" aria-pressed="${S[key] === v}" data-k="${key}" data-v="${v}">${l}</button>`).join('');
}
function render() {
  seg('sw-variant', 'variant', [['a', 'A · раздел'], ['b', 'B · вкладка'], ['c', 'C · над доской']]);
  seg('sw-state', 'state', [['full', 'обычные'], ['notokens', 'без токенов'], ['empty', 'пусто']]);
  seg('sw-width', 'width', [['full', 'широкое'], ['narrow', '860 px']]);
  document.getElementById('note').innerHTML = NOTES[S.variant];
  document.getElementById('app').style.setProperty('--w', S.width === 'narrow' ? '860px' : '100%');
  document.getElementById('main').innerHTML = S.variant === 'a' ? variantA() : S.variant === 'b' ? variantB() : variantC();
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k) { S[b.dataset.k] = b.dataset.v; if (b.dataset.k === 'variant') { try { history.replaceState(null, '', '#' + b.dataset.v); } catch (er) {} } }
  else if (b.dataset.range) S.range = b.dataset.range;
  else if (b.dataset.bd) S.breakdown = b.dataset.bd;
  else if (b.dataset.metric) S.metric = b.dataset.metric;
  else if ('drawer' in b.dataset) S.drawer = !S.drawer;
  else return;
  render();
});
// подсказка по дню
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const g = e.target.closest && e.target.closest('g.d');
  if (!g) { tip.hidden = true; return; }
  const d = DAYS.find((x) => x.date === g.dataset.day);
  const dt = new Date(d.date + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
  const cost = Object.values(d.byModel).reduce((a, b) => a + b, 0);
  const rows = g.dataset.metric === 'cost' ? Object.entries(d.byModel).map(([m, v]) => `<div class="r"><span><i class="swatch" style="background:${SERIES[m]}"></i>${m}</span><span class="num">$${v.toFixed(2).replace('.', ',')}</span></div>`).join('') : '';
  tip.innerHTML = `<b>${dt}</b>${rows}<div class="r"><span>Всего</span><span class="num">$${cost.toFixed(2).replace('.', ',')}</span></div>
    <div class="r"><span>Токены</span><span class="num">${(d.tokens / 1e6).toFixed(1).replace('.', ',')} млн</span></div>
    <div class="r"><span>Время агентов</span><span class="num">${dur(d.agentMs, false)}</span></div><div class="r"><span>Задач готово</span><span class="num">${d.tasksDone}</span></div>`;
  tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  tip.style.position = 'fixed';
});
render();
</script>
