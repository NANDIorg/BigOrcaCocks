<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 940 212" width="940" height="212" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, &quot;Liberation Sans&quot;, &quot;DejaVu Sans&quot;, sans-serif"><title id="t">orca-board: как это работает</title><desc id="d">Вы ставите цель координатору, он раскладывает её на доске задач, воркеры берут задачи — каждый в своём git worktree — и сдают ветки orca/&lt;taskId&gt;, которые приложение сливает в ветку задачи feature/&lt;runId&gt;-&lt;slug&gt;; вопросы и ревью возвращаются к вам.</desc><rect fill="#151b23" stroke="#3d444d" stroke-width="1.5" x="0" y="58" width="132" height="96" rx="14"/><g fill="none" stroke="#7b86f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(66 92)"><circle cx="0" cy="-7" r="6"/><path d="M-11 13a11 11 0 0 1 22 0"/></g><text fill="#f0f6fc" font-weight="600" x="66" y="136" text-anchor="middle" font-size="16">Вы</text><text fill="#9198a1" text-anchor="middle" font-size="13.5"><tspan x="66" y="180">Ставите цель и</tspan><tspan x="66" y="198">принимаете результат</tspan></text><rect fill="#151b23" stroke="#3d444d" stroke-width="1.5" x="187" y="58" width="132" height="96" rx="14"/><g fill="none" stroke="#7b86f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(253 92)"><rect x="-14" y="-11" width="28" height="22" rx="4"/><path d="M-7 -3l5 4-5 4M2 6h8"/></g><text fill="#f0f6fc" font-weight="600" x="253" y="136" text-anchor="middle" font-size="16">Координатор</text><text fill="#9198a1" text-anchor="middle" font-size="13.5"><tspan x="253" y="180">Агент с CLI orca-board,</tspan><tspan x="253" y="198">раскладывает цель</tspan></text><rect fill="#151b23" stroke="#3d444d" stroke-width="1.5" x="374" y="58" width="132" height="96" rx="14"/><g fill="none" stroke="#7b86f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(440 92)"><rect x="-14" y="-12" width="28" height="24" rx="4"/><path d="M-6 -6v10M0 -6v5M6 -6v12"/></g><text fill="#f0f6fc" font-weight="600" x="440" y="136" text-anchor="middle" font-size="16">Доска</text><text fill="#9198a1" text-anchor="middle" font-size="13.5"><tspan x="440" y="180">Задачи по колонкам,</tspan><tspan x="440" y="198">зависимости, ревью</tspan></text><rect fill="#151b23" stroke="#3d444d" stroke-width="1.5" x="561" y="58" width="132" height="96" rx="14"/><g fill="none" stroke="#7b86f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(627 92)"><rect x="-14" y="-12" width="18" height="12" rx="3" fill="#151b23"/><rect x="-8" y="-6" width="18" height="12" rx="3" fill="#151b23"/><rect x="-2" y="0" width="16" height="12" rx="3" fill="#151b23"/></g><text fill="#f0f6fc" font-weight="600" x="627" y="136" text-anchor="middle" font-size="16">Воркеры</text><text fill="#9198a1" text-anchor="middle" font-size="13.5"><tspan x="627" y="180">Свой worktree, ветка</tspan><tspan x="627" y="198">orca/&lt;taskId&gt;</tspan></text><rect fill="#151b23" stroke="#3d444d" stroke-width="1.5" x="748" y="58" width="132" height="96" rx="14"/><g fill="none" stroke="#7b86f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(814 92)"><circle cx="-7" cy="-9" r="3.2"/><circle cx="-7" cy="10" r="3.2"/><circle cx="8" cy="-2" r="3.2"/><path d="M-7 -5.8V6.8M8 1.2C8 8 -7 4 -7 6.8"/></g><text fill="#f0f6fc" font-weight="600" x="814" y="136" text-anchor="middle" font-size="16">Ветка задачи</text><text fill="#9198a1" text-anchor="middle" font-size="13.5"><tspan x="814" y="180">feature/&lt;runId&gt;-&lt;slug&gt;:</tspan><tspan x="814" y="198">сюда сливаются задачи</tspan></text><path stroke="#9198a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M136 106H177"/><path fill="#9198a1" d="M183 106l-8 -5v10z"/><text fill="#9198a1" x="159.5" y="97" text-anchor="middle" font-size="12.5">цель</text><path stroke="#9198a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M323 106H364"/><path fill="#9198a1" d="M370 106l-8 -5v10z"/><text fill="#9198a1" x="346.5" y="97" text-anchor="middle" font-size="12.5">задачи</text><path stroke="#9198a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M510 106H551"/><path fill="#9198a1" d="M557 106l-8 -5v10z"/><text fill="#9198a1" x="533.5" y="97" text-anchor="middle" font-size="12.5">запуск</text><path stroke="#9198a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M697 106H738"/><path fill="#9198a1" d="M744 106l-8 -5v10z"/><text fill="#9198a1" x="720.5" y="97" text-anchor="middle" font-size="12.5">done</text><path stroke="#9198a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" d="M440 57V32H66V48"/><path fill="#9198a1" d="M66 56l-5 -8h10z"/><text fill="#9198a1" x="253" y="24" text-anchor="middle" font-size="12.5">вопросы и ревью — за вами</text></svg>
