<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 496" width="376" height="496" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, &quot;Liberation Sans&quot;, &quot;DejaVu Sans&quot;, sans-serif"><title id="t">orca-board: как это работает</title><desc id="d">Вы ставите цель координатору, он раскладывает её на доске задач, воркеры берут задачи — каждый в своём git worktree — и сдают ветку задачи; вопросы и ревью возвращаются к вам.</desc><rect fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" x="10" y="10" width="300" height="68" rx="14"/><g fill="none" stroke="#5a63c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(46 44) scale(.85)"><circle cx="0" cy="-7" r="6"/><path d="M-11 13a11 11 0 0 1 22 0"/></g><text fill="#1f2328" font-weight="600" x="84" y="40" font-size="15">Вы</text><text fill="#59636e" x="84" y="60" font-size="13">Ставите цель, принимаете итог</text><rect fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" x="10" y="112" width="300" height="68" rx="14"/><g fill="none" stroke="#5a63c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(46 146) scale(.85)"><rect x="-14" y="-11" width="28" height="22" rx="4"/><path d="M-7 -3l5 4-5 4M2 6h8"/></g><text fill="#1f2328" font-weight="600" x="84" y="142" font-size="15">Координатор</text><text fill="#59636e" x="84" y="162" font-size="13">Раскладывает цель на задачи</text><rect fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" x="10" y="214" width="300" height="68" rx="14"/><g fill="none" stroke="#5a63c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(46 248) scale(.85)"><rect x="-14" y="-12" width="28" height="24" rx="4"/><path d="M-6 -6v10M0 -6v5M6 -6v12"/></g><text fill="#1f2328" font-weight="600" x="84" y="244" font-size="15">Доска</text><text fill="#59636e" x="84" y="264" font-size="13">Колонки, зависимости, ревью</text><rect fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" x="10" y="316" width="300" height="68" rx="14"/><g fill="none" stroke="#5a63c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(46 350) scale(.85)"><rect x="-14" y="-12" width="18" height="12" rx="3" fill="#f6f8fa"/><rect x="-8" y="-6" width="18" height="12" rx="3" fill="#f6f8fa"/><rect x="-2" y="0" width="16" height="12" rx="3" fill="#f6f8fa"/></g><text fill="#1f2328" font-weight="600" x="84" y="346" font-size="15">Воркеры</text><text fill="#59636e" x="84" y="366" font-size="13">Свой git worktree на каждого</text><rect fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" x="10" y="418" width="300" height="68" rx="14"/><g fill="none" stroke="#5a63c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(46 452) scale(.85)"><circle cx="-7" cy="-9" r="3.2"/><circle cx="-7" cy="10" r="3.2"/><circle cx="8" cy="-2" r="3.2"/><path d="M-7 -5.8V6.8M8 1.2C8 8 -7 4 -7 6.8"/></g><text fill="#1f2328" font-weight="600" x="84" y="448" font-size="15">Ветка задачи</text><text fill="#59636e" x="84" y="468" font-size="13">orca/&lt;id&gt; → слияние после ревью</text><path stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M46 81V104"/><path fill="#59636e" d="M46 109l-5 -8h10z"/><text fill="#59636e" x="58" y="99" font-size="12">цель</text><path stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M46 183V206"/><path fill="#59636e" d="M46 211l-5 -8h10z"/><text fill="#59636e" x="58" y="201" font-size="12">задачи</text><path stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M46 285V308"/><path fill="#59636e" d="M46 313l-5 -8h10z"/><text fill="#59636e" x="58" y="303" font-size="12">запуск</text><path stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M46 387V410"/><path fill="#59636e" d="M46 415l-5 -8h10z"/><text fill="#59636e" x="58" y="405" font-size="12">done</text><path stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" d="M311 248H350V44H320"/><path fill="#59636e" d="M312 44l8 -5v10z"/><text fill="#59636e" font-size="12" text-anchor="middle" transform="translate(364 146) rotate(-90)">вопросы и ревью — за вами</text></svg>
