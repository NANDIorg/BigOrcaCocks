<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран задачи — C: по состоянию</title>
<!--
  Вариант C «Экран по состоянию». Одна прокручиваемая страница, наверху — главный блок, который меняется
  вместе со статусом задачи: черновик — цель и запуск; в работе — «Сейчас» (координатор, прогресс по этапам);
  нужен ответ — вопрос координатора крупно; проверка — сводка и чек-лист «что проверить» с липкой панелью
  решения внизу; сделано — итог. Ниже — лента, подзадачи (на проверке и после — свёрнуты), цель, история.
  Липкая шапка с якорями разделов.
  Статичный макет: данные выдуманы, кнопки не работают (кроме переключателей). Сверху — состояние глобальной
  задачи и ширина окна (860 px — минимальная ширина окна приложения). Доска подзадач и лента «Ждут вас» —
  как в master (docs/design/local-board/variant-ab.html), здесь упрощены.
-->
<style>
:root {
  --page: #26282e; --frame: #2e3037; --side: #33353d; --side-2: #383b43;
  --card: #3b3e47; --card-hover: #41444e; --chip: #5b5e68; --chip-text: #c9ccd6;
  --line: rgba(255,255,255,.06); --text: #ecedf1; --muted: #9ea1ad;
  --accent: #7b86f5; --accent-2: #5a63c8;
  --col-backlog: #6b6f7c; --col-ready: #7b86f5; --col-progress: #f08a3a; --col-input: #e8b04a;
  --col-review: #b57bee; --col-done: #5ad1cc; --danger: #ef6b6b; --ok: #8fd16a;
  --term-bg: #1b1c21;
  --shadow: 0 1px 0 rgba(0,0,0,.25);
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 14px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.grow { flex: 1; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--chip); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--chip-text); }

/* ---------- панель макета (не часть дизайна) ---------- */
.mock-bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.mock-bar b { font-size: 14px; }
.seg-group { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--chip); border-radius: 16px; overflow: hidden; }
.seg-group button { background: transparent; border: 0; padding: 4px 12px; color: var(--muted); white-space: nowrap; }
.seg-group button + button { border-left: 1px solid var(--chip); }
.seg-group button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.mock-note { padding: 8px 16px 0; font-size: 12.5px; color: var(--muted); max-width: 1440px; margin: 0 auto; }
.stage { padding: 16px; overflow-x: auto; }
.win { margin: 0 auto; width: 1440px; max-width: none; height: 820px; display: grid; grid-template-columns: 64px minmax(0,1fr); background: var(--frame); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); transition: width .2s; }
.rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 0; }
.rail i { width: 36px; height: 36px; border-radius: 10px; background: var(--side-2); display: block; opacity: .6; }
.rail i.on { background: var(--accent); opacity: 1; }
.app { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* Шапка приложения (main-head) — как сейчас, в макете для контекста. */
.app-head { display: flex; align-items: center; gap: 10px; padding: 12px 24px 0; }
.app-head h1 { margin: 0; font-size: 18px; }
.app-tabs { display: flex; gap: 18px; padding: 8px 24px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.app-tabs span { padding: 6px 0 8px; color: var(--muted); }
.app-tabs span.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.pill-btn { height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--chip); background: transparent; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
.pill-btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- кнопки, чипы ---------- */
.btn { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--chip); background: transparent; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #1d1f24; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--side-2); }
.btn.sm { height: 24px; padding: 0 9px; font-size: 12px; border-radius: 12px; }
.btn.lg { height: 36px; padding: 0 16px; font-size: 14px; border-radius: 18px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 6px; white-space: nowrap; }
.chip.prio-high { color: var(--col-progress); background: color-mix(in srgb, var(--col-progress) 16%, transparent); }
.chip.type { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.chip.st { color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); font-weight: 600; }
.chip.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--col-done); box-shadow: 0 0 0 3px color-mix(in srgb, var(--col-done) 25%, transparent); flex: 0 0 auto; }
.live-dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--col-done) 0%, transparent); } }
@media (prefers-reduced-motion: reduce) { .live-dot.pulse { animation: none; } }
.off-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip); flex: 0 0 auto; }
.st-backlog { --c: var(--col-backlog); } .st-work { --c: var(--col-progress); } .st-input { --c: var(--col-input); }
.st-review { --c: var(--col-review); } .st-done { --c: var(--col-done); }

/* ---------- прогресс ---------- */
.prog { display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 160px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--side-2); overflow: hidden; display: flex; min-width: 60px; }
.bar span { display: block; height: 100%; }

/* ---------- степпер статусов глобальной задачи ---------- */
.steps { display: flex; align-items: center; gap: 0; font-size: 12px; min-width: 0; }
.step { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; padding: 3px 8px; border-radius: 999px; border: 0; background: transparent; }
.step i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--chip); flex: 0 0 auto; }
.step.past i { background: var(--chip); }
.step.now { color: var(--text); font-weight: 600; background: color-mix(in srgb, var(--c) 16%, transparent); }
.step.now i { border-color: var(--c); background: var(--c); }
.step-sep { width: 14px; height: 1px; background: var(--chip); flex: 0 0 auto; }
.step:hover:not(.now) { color: var(--text); background: var(--side-2); }

/* ---------- markdown ---------- */
.md { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.md h4 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.md h4:first-child { margin-top: 0; }
.md p { margin: 0 0 8px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md li { margin: 2px 0; }
.md code { font: 12px ui-monospace, Menlo, monospace; background: var(--side-2); padding: 1px 5px; border-radius: 4px; }
.md.clamp { max-height: 7.8em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }

/* ---------- лента «Ждут вас» (как в master, AttentionFeed) ---------- */
.attn { border-radius: var(--radius); background: color-mix(in srgb, var(--col-input) 7%, var(--side)); border: 1px solid color-mix(in srgb, var(--col-input) 30%, transparent); }
.attn-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; }
.attn-head h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.attn-head .n { background: var(--col-input); color: #1d1f24; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; }
.attn-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 12px; }
.act-card { flex: 0 0 290px; background: var(--card); border-radius: 12px; padding: 9px 12px; display: flex; flex-direction: column; gap: 7px; border-left: 3px solid var(--k); box-shadow: var(--shadow); min-width: 0; }
.act-card .kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--k); display: flex; gap: 6px; align-items: center; }
.act-card .kind .ago { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: auto; }
.act-card .task { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-card .q { font-size: 13px; font-weight: 600; line-height: 1.35; }
.act-card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: auto; }
.opt { border: 1px solid var(--chip); background: transparent; border-radius: 8px; padding: 2px 9px; font-size: 12.5px; }
.opt.rec { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-q { --k: var(--col-input); } .k-bad { --k: var(--danger); } .k-rev { --k: var(--col-review); } .k-coord { --k: var(--accent); }

/* ---------- тулбар и доска (как в master, Board) ---------- */
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter { border: 1px solid var(--chip); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--chip-text); display: inline-flex; gap: 6px; }
.filter[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); color: var(--text); }
.filter .n { font-weight: 600; }
.filter.wait .n { color: var(--col-input); }
.sort { background: var(--side); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 3px 8px; font-size: 12px; }
.board { display: flex; gap: 12px; overflow-x: auto; min-height: 0; }
.column { flex: 1 1 240px; min-width: 220px; max-width: 340px; display: flex; flex-direction: column; min-height: 0; background: var(--side); border-radius: var(--radius); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; font-size: 13px; font-weight: 600; border-top: 3px solid var(--c); border-radius: var(--radius) var(--radius) 0 0; }
.col-head .count { color: var(--muted); font-weight: 500; }
.col-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.column.collapsed { flex: 0 0 44px; min-width: 44px; align-items: center; }
.column.collapsed .col-head { flex-direction: column; border-top: 0; padding: 12px 0; width: 100%; }
.column.collapsed .vtitle { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; font-weight: 600; margin-top: 8px; }
.column.collapsed .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.col-empty { color: var(--muted); font-size: 12px; padding: 8px 6px; }
.card { position: relative; background: var(--card); border-radius: 10px; padding: 9px 10px 9px 13px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
.card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--state, transparent); }
.card.s-live { --state: var(--col-progress); } .card.s-human { --state: var(--col-input); }
.card.s-review { --state: var(--col-review); } .card.s-bad { --state: var(--danger); }
.card.s-blocked .name { color: var(--muted); }
.card .line1 { display: flex; gap: 6px; align-items: flex-start; }
.prio { flex: 0 0 auto; font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 5px; border-radius: 4px; color: var(--col-progress); background: color-mix(in srgb, var(--col-progress) 16%, transparent); }
.name { font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; min-width: 0; }
.meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.agent { flex: 0 0 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #fff; background: #d97757; }
.agent.codex { background: #10a37f; }
.meta .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.meta .time { white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta .time.live { color: var(--col-progress); font-weight: 600; }
.stage-pill { display: inline-flex; font-size: 11px; color: var(--chip-text); border: 1px solid var(--chip); border-radius: 6px; padding: 0 6px; white-space: nowrap; margin-top: 6px; }
.tag.dep { display: inline-block; margin-top: 6px; font-size: 11.5px; color: var(--muted); border: 1px dashed var(--chip); border-radius: 999px; padding: 0 8px; }
.act { margin-top: 8px; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; font-size: 12px; background: transparent; border: 1px dashed color-mix(in srgb, var(--state) 50%, transparent); }
.act .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act .to-feed { color: var(--accent); white-space: nowrap; }
.board-empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); border: 1px dashed var(--chip); border-radius: var(--radius); padding: 24px; font-size: 13px; }
.board-empty b { color: var(--text); display: block; margin-bottom: 4px; font-size: 14px; }

/* ---------- хвост терминала координатора (только чтение) ---------- */
.tail { background: var(--term-bg); border-radius: 10px; padding: 10px 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #c9ccd6; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.tail .d { color: var(--muted); }
.tail .g { color: var(--ok); }
.tail .y { color: var(--col-input); }
.tail .cursor { display: inline-block; width: 7px; height: 13px; background: var(--muted); vertical-align: -2px; }

/* ---------- история ---------- */
.tl { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.tl li { display: grid; grid-template-columns: 86px 14px minmax(0,1fr); gap: 8px; padding: 5px 0; align-items: start; }
.tl .at { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; padding-top: 1px; }
.tl .pt { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--c, var(--chip)); }
.tl .what b { font-weight: 600; }
.tl .what .sub { display: block; color: var(--muted); font-size: 12px; }
.tl .day { display: block; grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 0 2px; }

/* ---------- мелочи ---------- */
.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.branch { font: 11.5px ui-monospace, Menlo, monospace; color: var(--chip-text); }
.ret { border-left: 3px solid var(--col-review); padding: 4px 10px; font-size: 13px; background: color-mix(in srgb, var(--col-review) 7%, transparent); border-radius: 0 8px 8px 0; }
.ret .at { font-size: 11.5px; color: var(--muted); display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.view-root { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

/* ================= вариант C ================= */
.vc { flex: 1; min-height: 0; overflow-y: auto; position: relative; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .vc { scroll-behavior: auto; } }
.vc-head { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--frame) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 10px 24px 0; display: flex; flex-direction: column; gap: 6px; }
.vc-r1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
.vc-r1 h2 { margin: 0; font-size: 18px; font-weight: 600; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { border: 0; background: transparent; color: var(--muted); padding: 3px 6px; border-radius: 8px; white-space: nowrap; font-size: 13px; }
.back:hover { color: var(--text); background: var(--side-2); }
.anchors { display: flex; gap: 2px; overflow-x: auto; font-size: 12.5px; }
.anchors a { color: var(--muted); text-decoration: none; padding: 5px 10px 8px; white-space: nowrap; }
.anchors a:hover { color: var(--text); }
.anchors a.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.anchors a .n { color: var(--col-input); font-weight: 700; }
.vc-body { padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 18px; }
.hero { border-radius: 16px; padding: 18px 20px; background: color-mix(in srgb, var(--c) 8%, var(--side)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.hero.one { grid-template-columns: minmax(0, 1fr); }
.hero-kicker { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); display: flex; gap: 8px; align-items: center; }
.hero h3 { margin: 4px 0 10px; font-size: 20px; line-height: 1.3; }
.hero .md { font-size: 14px; }
.hero-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.big-prog { display: flex; align-items: baseline; gap: 8px; }
.big-prog b { font-size: 32px; font-variant-numeric: tabular-nums; }
.stage-bars { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.stage-bars div { display: grid; grid-template-columns: 90px minmax(0,1fr) 24px; align-items: center; gap: 8px; }
.stage-bars .bar span { background: var(--c); }
.q-big { background: var(--card); border-radius: 12px; padding: 14px 16px; border-left: 3px solid var(--accent); display: flex; flex-direction: column; gap: 10px; }
.q-big .q { font-size: 15px; font-weight: 600; line-height: 1.4; }
.q-big .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.q-big .opt { padding: 6px 12px; font-size: 13.5px; border-radius: 10px; text-align: left; }
.q-big .opt small { display: block; color: var(--muted); font-size: 12px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
.checklist input { margin-top: 3px; accent-color: var(--ok); width: 16px; height: 16px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.sect { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 90px; }
.sect > h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.sect > h3 .sub { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.sect .board { height: 440px; }
.fold { display: flex; align-items: center; gap: 12px; background: var(--side); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; align-items: start; }
.panel { background: var(--side); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.decide { position: sticky; bottom: 0; z-index: 3; margin-top: -8px; padding: 12px 24px; background: color-mix(in srgb, var(--frame) 94%, transparent); backdrop-filter: blur(6px); border-top: 1px solid color-mix(in srgb, var(--col-review) 40%, transparent); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.decide .ret-field { flex: 1 1 260px; min-width: 0; background: var(--side); border: 1px solid var(--chip); color: var(--text); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 13px; resize: none; height: 34px; }
.win[data-narrow="true"] .vc-head, .win[data-narrow="true"] .vc-body, .win[data-narrow="true"] .decide { padding-left: 16px; padding-right: 16px; }
.win[data-narrow="true"] .hero, .win[data-narrow="true"] .two { grid-template-columns: minmax(0, 1fr); }
.win[data-narrow="true"] .anchors .opt-a { display: none; }

  ).join('') + '</div>'
}
function progHTML(s) {
  const p = progressOf(s)
  if (!p.total) return '<div class="prog muted">Подзадач пока нет</div>'

  const n = (c) => t.filter((x) => x.col === c).length / p.total * 100

    <span style="width:${n('done')}%;background:var(--col-done)"></span><span style="width:${n('review')}%;background:var(--col-review)"></span><span style="width:${n('in_progress')}%;background:var(--col-progress)"></span></div><span class="muted">${p.pct}%</span></div>`
}

function mountMock(render, defaultState) {
  let state = defaultState || 'work'
  let width = 1440
  const bar = document.getElementById('states')
  const wbar = document.getElementById('widths')
  const win = document.getElementById('win')
  bar.innerHTML = STATES.map((s) => `<button data-s="${s.id}">${s.title}</button>`).join('')
  wbar.innerHTML = [1440, 1100, 860].map((w) => `<button data-w="${w}">${w} px</button>`).join('')
  const draw = () => {
    bar.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === state)))
    wbar.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.w === width)))
    win.style.width = width + 'px'
    win.dataset.narrow = String(width <= 900)
    document.getElementById('view').innerHTML = render(state, width)
    if (window.afterRender) window.afterRender(state, width)
  }
  bar.onclick = (e) => { const b = e.target.closest('button'); if (b) { state = b.dataset.s; draw() } }
  wbar.onclick = (e) => { const b = e.target.closest('button'); if (b) { width = +b.dataset.w; draw() } }
  window.redraw = draw
  draw()
}

    <div class="hero-side"><div class="panel"><b style="font-size:13px">Как пойдёт работа</b><dl class="kv" style="margin-top:8px"><dt>Тип</dt><dd>Фича</dd><dt>Роли</dt><dd>Бэкенд, Фронтенд, Тестировщик, Аналитик, Техписатель</dd><dt>Этапы</dt><dd>Реализация → Ревью кода → Сделано</dd></dl></div>
    <button class="btn primary lg" style="justify-content:center">▶ Запустить координатора</button><span class="muted" style="font-size:12.5px">Координатор разобьёт цель на подзадачи и раздаст их воркерам. Или добавьте подзадачи сами: «Новая подзадача».</span>
    <button class="btn ghost" style="align-self:flex-start">✎ Изменить цель, тип, приоритет</button></div></section>`
  if (s === 'work') return `<section class="hero ${st.cls}" id="now"><div><div class="hero-kicker"><span class="live-dot pulse"></span>Сейчас · координатор работает</div><h3>Проверил #3, ждёт, пока #4 и #5 дойдут до ревью</h3>
    <div class="tail" style="max-height:150px">${TAIL.work}</div><div class="hero-meta" style="margin-top:10px"><span>Claude Opus · 2-й запуск · 1 ч 12 м</span><button class="btn sm">Открыть терминал</button><button class="btn sm danger">■ Остановить</button></div></div>
    <div class="hero-side"><div class="big-prog"><b>4</b><span class="muted">из 9 подзадач сделано</span></div>${progHTML(s)}
    <div class="stage-bars">${STAGES.map(([n, c, a, b]) => `<div style="--c:${c}"><span>${n}</span><span class="bar"><span style="width:${a / b * 100}%"></span></span><span class="muted">${a}</span></div>`).join('')}</div>
    <div class="hero-meta"><span>⏱ ${timeOf(s)}</span></div></div></section>`
  if (s === 'input') return `<section class="hero one ${st.cls}" id="now"><div class="hero-kicker">Нужен ответ · время задачи стоит</div>
    <div class="q-big"><span class="muted" style="font-size:12.5px">Координатор спрашивает · 6 мин назад</span><div class="q">PDF-рендер не помещается в 512 МБ. Поднять лимит контейнера до 1 ГБ или рендерить постранично?</div>
    <div class="opts"><button class="opt rec">★ Поднять до 1 ГБ<small>быстрее, +1 ГБ на под</small></button><button class="opt">Постранично<small>медленнее, память ровная</small></button><button class="opt">Своё…</button></div></div>
    <div class="hero-meta"><span>Ещё 2 пункта — в ленте «Ждут вас» ниже</span><a href="#feed" style="color:var(--accent)">к ленте ↓</a></div></section>`
  const rev = s === 'review'
  return `<section class="hero ${st.cls}" id="now"><div><div class="hero-kicker">${rev ? 'Проверка · все 9 подзадач сделаны' : 'Сделано · подтверждена 24.09, 15:02'}</div><h3>Что сделал координатор</h3><div class="md">${SUMMARY.split('<h4>Что проверить')[0]}</div></div>
    <div class="hero-side"><div class="panel"><b style="font-size:13px">Что проверить</b><ul class="checklist" style="margin-top:10px">
      <li><label><input type="checkbox" ${rev ? '' : 'checked'}>Отчёт «Продажи 2025» → CSV: скачивается, кириллица в Excel</label></li>
      <li><label><input type="checkbox" ${rev ? 'checked' : 'checked'}>Тот же отчёт → PDF: таблица не обрезана справа</label></li>
      <li><label><input type="checkbox" ${rev ? '' : 'checked'}>Отчёт за 5 лет → PDF: понятная ошибка через ~2 мин</label></li></ul>
      <span class="muted" style="font-size:11.5px;display:block;margin-top:8px">Отметки — только для вас, в задачу не сохраняются</span></div>
    ${returnsHTML(s)}<div class="hero-meta"><span>Сводка 24.09, 14:33</span><span>⏱ ${timeOf(s)}</span><span>7 веток в master</span></div></div></section>`
}
function render(s, w) {
  const late = s === 'review' || s === 'done'
  const feed = FEED[s].length ? `<section class="sect" id="feed">${feedHTML(s)}</section>` : ''
  const p = progressOf(s)
  const board = s === 'draft' ? '' : late
    ? `<section class="sect" id="board"><div class="fold"><b>Подзадачи</b>${progHTML(s)}<span class="grow"></span><button class="btn sm">Развернуть доску ▾</button></div></section>`
    : `<section class="sect" id="board"><h3>Подзадачи <span class="sub">${p.done} из ${p.total}</span></h3>${toolbarHTML(s)}${boardHTML(s)}</section>`
  const goal = s === 'draft' ? '' : `<section class="panel sect" id="goal"><h3>Цель <span class="grow"></span><button class="btn ghost sm">✎ Изменить</button></h3><div class="md ${late ? '' : 'clamp'}">${GOAL}</div>${late ? '' : '<button class="btn ghost sm" style="align-self:flex-start">Показать полностью</button>'}</section>`
  const hist = `<section class="panel sect" id="history"><h3>История</h3>${historyHTML(s)}</section>`
  const st = stepOf(s)
  const anchors = [['now', { draft: 'Запуск', work: 'Сейчас', input: 'Вопрос', review: 'Итог', done: 'Итог' }[s]], ...(FEED[s].length ? [['feed', `Ждут вас <span class="n">${FEED[s].length}</span>`]] : []), ...(s === 'draft' ? [] : [['board', 'Подзадачи'], ['goal', 'Цель']]), ['history', 'История']]
  return `<div class="vc"><header class="vc-head"><div class="vc-r1"><button class="back" title="К общей доске (Esc)">←</button><h2 title="${TITLE}">${TITLE}</h2>
    <button class="chip st ${st.cls}" style="border:0" title="Перенести в…">${st.label} ▾</button><span class="chip prio-high">↑</span><span class="chip type">Фича</span><button class="btn ghost" aria-label="Ещё">⋯</button></div>
    <nav class="anchors" aria-label="Разделы">${anchors.map(([id, l], i) => `<a href="#${id}" class="${i === 0 ? 'on' : ''}">${l}</a>`).join('')}</nav></header>
    <div class="vc-body">${heroHTML(s)}${late ? '' : feed}${board}${late ? `<div class="two">${hist}${goal}</div>` : `<div class="two">${goal}${hist}</div>`}</div>
    ${s === 'review' ? `<div class="decide" role="region" aria-label="Решение по задаче"><button class="btn ok lg">✓ Подтвердить</button><span class="muted">или</span><textarea class="ret-field" rows="1" aria-label="Что доделать" placeholder="Что доделать — вернуть в работу с уточнением…"></textarea><button class="btn lg">Вернуть в работу</button></div>` : ''}</div>`
}

mountMock(render, 'review')
</script>
</body>
</html>
