<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы со всеми файлами — вариант 3: фокус и палитра ⌘P</title>
<!--
  Макет окна «Документы» со всеми файлами проекта. Выдвижное дерево, палитра ⌘P, всё остальное в строке статуса.
  Самодостаточный файл: открывается в браузере без сборки и без сети (стили и скрипт — внутри).
  Токены — тема graphite (apps/desktop/src/shared/theme.ts), классы docs-* — из styles.css, новое — docs-code / docs-status / docs-html / docs-blank.
  Панель сверху — не часть приложения: переключает состояние, ширину окна и подсветку. Данные выдуманы.
  Адрес: #code, #md, #search … (id состояния) и ?w=812 (ширина окна).
-->
<style>
/* ===== Токены — тема graphite из apps/desktop/src/shared/theme.ts (тема по умолчанию) ===== */
:root {
  color-scheme: dark;
  --page: #252422; --frame: #2b2a28; --side: #302f2c; --side-2: #363530; --card: #3a3935; --card-hover: #42413c;
  --chip: #5a5850; --line: #eeebe31c; --overlay-ink: #ffffff; --code-bg: #1e1d1b; --tooltip-bg: #1f1e1c; --preview-bg: #1f1e1c;
  --text: #eeebe3; --muted: #b2afa5; --subtle: #d2cfc5;
  --accent: #b4c9bd; --accent-2: #98b3a4; --accent-hover: #cad9cf; --on-accent: #252422;
  --col-backlog: #848279; --col-ready: #a5b5c4; --col-progress: #d8a36a; --col-input: #dfc58f; --col-review: #bea8c1; --col-done: #99bfa6;
  --danger: #e9998e; --term-bg: #1f1e1c;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #171615; color: var(--text); font: 14px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
svg.i.s { width: 14px; height: 14px; }
svg.i.xs { width: 12px; height: 12px; }
kbd { font: 11px var(--font-mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--chip); color: var(--muted); background: var(--frame); }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ===== Панель макета (не часть приложения) ===== */
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 14px; background: #121110; border-bottom: 1px solid #000; font-size: 12px; color: var(--muted); flex-shrink: 0; }
.mk-bar b { color: var(--text); font-weight: 600; }
.mk-bar a { color: var(--accent); text-decoration: none; }
.mk-grp { display: flex; align-items: center; gap: 6px; }
.mk-grp .lbl { color: #8d8a82; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.mk-seg { display: inline-flex; flex-wrap: wrap; }
.mk-seg button { background: transparent; border: 1px solid #3a3835; color: var(--muted); padding: 3px 9px; font-size: 12px; margin-left: -1px; }
.mk-seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.mk-seg button:last-child { border-radius: 0 8px 8px 0; }
.mk-seg button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mk-seg button:hover:not(.on) { color: var(--text); border-color: #5a5850; position: relative; }
.mk-note { padding: 6px 14px; font-size: 12.5px; background: #1b1a18; color: var(--subtle); border-bottom: 1px solid #000; flex-shrink: 0; line-height: 1.4; }
.mk-note .dec { color: var(--col-input); }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 14px; }

/* ===== Окно «Документы» (аналог .docs-modal) ===== */
.dv { position: relative; width: 100%; max-width: var(--w, 1480px); height: 100%; background: var(--page); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.5); container: docs / inline-size; transition: max-width .2s; }
.docs-grow { flex: 1; min-width: 0; }
.docs-i { width: 14px; height: 14px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
.icon-btn:hover:not(:disabled) { color: var(--text); background: var(--side-2); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn.on { color: var(--accent); }
.icon-btn.sm { width: 24px; height: 24px; }
.btn-sm { height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--chip); background: transparent; color: var(--text); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-sm:hover { border-color: var(--text); }
.btn-sm.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-sm.primary:hover { background: var(--accent-hover); }
.btn-sm.xs { height: 26px; font-size: 12px; padding: 0 12px; }
.chip { border: 1px solid var(--chip); color: var(--subtle); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
.docs-chip { font-size: 10px; padding: 0 6px; line-height: 16px; flex-shrink: 0; }
.docs-chip.new { border-color: color-mix(in srgb, var(--col-done) 50%, transparent); color: var(--col-done); }
.docs-chip.mod { border-color: color-mix(in srgb, var(--col-input) 50%, transparent); color: var(--col-input); }
.docs-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

.docs-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 20px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.docs-head h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; min-width: 0; white-space: nowrap; }
.docs-head h3 svg { width: 18px; height: 18px; }
.docs-head .proj { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.docs-keys { color: var(--muted); font-size: 12px; white-space: nowrap; }
.docs-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); }

/* ----- дерево ----- */
.docs-tree { background: var(--frame); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.docs-tree-search { margin: 12px 12px 8px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; height: 34px; border-radius: 10px; background: var(--side); color: var(--muted); border: 1px solid transparent; }
.docs-tree-search:focus-within { border-color: var(--accent); background: var(--side-2); }
.docs-tree-search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); outline: none; font: inherit; font-size: 13px; padding: 0; }
.docs-tree-search input::placeholder { color: var(--muted); }
.docs-tree-tools { display: flex; align-items: center; gap: 4px; padding: 0 12px 6px; font-size: 12px; color: var(--muted); }
.docs-seg { display: inline-flex; background: var(--side); border-radius: 8px; padding: 2px; }
.docs-seg button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 3px 9px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.docs-seg button:hover:not(.on) { color: var(--text); }
.docs-seg button.on { background: var(--card); color: var(--text); }
.docs-tree-body { flex: 1; overflow-y: auto; padding: 0 6px 16px; font-size: 13px; }
.docs-grp { display: flex; align-items: center; gap: 6px; padding: 12px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.docs-grp .n { margin-left: auto; text-transform: none; letter-spacing: 0; }
.docs-hint { padding: 2px 8px; font-size: 12px; color: var(--muted); }
.docs-row { width: 100%; border: 0; background: transparent; font: inherit; text-align: left; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--subtle); white-space: nowrap; min-width: 0; font-size: 13px; }
.docs-row:hover { background: color-mix(in srgb, var(--overlay-ink) 3.5%, transparent); }
.docs-row:focus-visible, .docs-hit:focus-visible, .docs-card:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.docs-row .docs-nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.docs-row .docs-tm, .docs-hit .docs-tm { margin-left: auto; font-size: 11px; color: var(--muted); flex-shrink: 0; padding-left: 6px; }
.docs-row .docs-chip + .docs-tm { margin-left: 0; }
.docs-row .docs-nm + .docs-tm { margin-left: auto; }
.docs-spacer { width: 14px; flex-shrink: 0; }
.docs-chev { color: var(--muted); transition: transform .15s; }
.docs-row.open .docs-chev { transform: rotate(90deg); }
.docs-row.dir { color: var(--muted); }
.docs-row.dir .docs-cnt { margin-left: auto; font-size: 11px; }
.docs-row.active { background: var(--side-2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.docs-row.dim .docs-nm { color: var(--muted); }
.fi { display: inline-grid; place-items: center; color: var(--tint, var(--muted)); flex-shrink: 0; }
.docs-row.dir > .fi { color: var(--muted); }
.ext { font: 600 9.5px/1 var(--font-mono); min-width: 24px; text-align: center; padding: 3px 0; border-radius: 4px; color: var(--tint, var(--muted)); background: color-mix(in srgb, var(--tint, var(--muted)) 14%, transparent); letter-spacing: .02em; flex-shrink: 0; }
.lnk { display: inline-grid; place-items: center; color: var(--muted); flex-shrink: 0; }
.lnk.out { color: var(--danger); }
.docs-task-row { display: flex; align-items: center; gap: 8px; padding: 8px 8px 4px; font-size: 12.5px; font-weight: 600; min-width: 0; }
.docs-task-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docs-task-row .st { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--muted); flex-shrink: 0; }
.docs-hit { width: 100%; border: 0; background: transparent; color: var(--subtle); font: inherit; text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 7px; min-width: 0; }
.docs-hit:hover { background: color-mix(in srgb, var(--overlay-ink) 3.5%, transparent); }
.docs-hit.kb { background: var(--side-2); box-shadow: inset 2px 0 0 var(--accent); }
.docs-hit-l1 { display: flex; gap: 6px; align-items: center; font-weight: 500; min-width: 0; width: 100%; font-size: 13px; }
.docs-hit-l1 .docs-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.docs-hit-l1.text { display: block; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docs-hit-l2 { display: flex; gap: 5px; align-items: center; font: 11px var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; width: 100%; padding-left: 20px; }
.docs-hit-l1.text + .docs-hit-l2 { padding-left: 0; }
.docs-hit b, .docs-row b { color: var(--col-input); font-weight: 600; }
.docs-more { margin: 6px 8px 2px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--chip); color: var(--muted); font-size: 12px; line-height: 1.4; }
.docs-more b { color: var(--text); font-weight: 600; }
.docs-tree-foot { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.docs-row-dir { margin-left: 6px; font: 11px var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.docs-trunc { margin: 0 12px 6px; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; font-size: 12px; line-height: 1.4; background: color-mix(in srgb, var(--col-input) 8%, transparent); border: 1px solid color-mix(in srgb, var(--col-input) 35%, transparent); color: var(--subtle); }
.docs-trunc svg { color: var(--col-input); margin-top: 1px; }
.docs-trunc b { color: var(--text); font-weight: 600; }

/* ----- панель документа ----- */
.docs-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.docs-crumbs { display: flex; align-items: center; gap: 6px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); min-height: 48px; flex-shrink: 0; }
.docs-path { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.docs-path .src, .docs-path .seg, .docs-path .cur { padding: 2px 6px; border-radius: 6px; }
.docs-path .src { color: var(--subtle); }
.docs-path button.seg { border: 0; background: transparent; color: inherit; font: inherit; }
.docs-path button.seg:hover { background: var(--side-2); color: var(--text); }
.docs-path .cur { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.docs-path .sep { color: var(--chip); }
.docs-path .seg { flex-shrink: 8; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.docs-path .src { flex-shrink: 0; }
.docs-path .cur { flex-shrink: 1; min-width: 48px; white-space: nowrap; }
.docs-ctl { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.vsep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex-shrink: 0; }
.seg2 { display: inline-flex; border: 1px solid var(--chip); border-radius: 14px; overflow: hidden; flex-shrink: 0; }
.seg2 button { height: 26px; padding: 0 11px; border: 0; background: transparent; color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg2 button + button { border-left: 1px solid var(--chip); }
.seg2 button:hover:not(.on) { color: var(--text); }
.seg2 button.on { background: var(--accent); color: var(--on-accent); }
.docs-find { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 16px; border-bottom: 1px solid var(--line); background: var(--frame); color: var(--muted); flex-shrink: 0; }
.docs-find input { flex: 0 1 320px; min-width: 0; height: 28px; border-radius: 8px; border: 1px solid var(--accent); background: var(--side-2); color: var(--text); padding: 0 10px; font: inherit; font-size: 13px; outline: none; }
.docs-find-count { font-size: 12px; min-width: 90px; }
.docs-find .icon-btn { width: 28px; height: 28px; }
.docs-body { flex: 1; overflow-y: auto; padding: 36px 56px 80px; min-height: 0; }
.docs-article { max-width: 76ch; margin: 0 auto; font-size: 15px; }
.docs-note, .docs-err { max-width: 76ch; margin: 0 auto 22px; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; font-size: 13px; }
.docs-note { background: color-mix(in srgb, var(--col-progress) 7%, transparent); border: 1px solid color-mix(in srgb, var(--col-progress) 30%, transparent); }
.docs-err { align-items: flex-start; background: color-mix(in srgb, var(--danger) 8%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.docs-err > svg { width: 18px; height: 18px; color: var(--danger); }
.docs-err b { color: var(--danger); }
.docs-err .icon-btn { width: 22px; height: 22px; }
.docs-err.flat { margin: 0 0 22px; max-width: none; }

/* ----- правая колонка: оглавление ----- */
.docs-toc { border-left: 1px solid var(--line); padding: 20px 16px; overflow-y: auto; font-size: 13px; min-width: 0; }
.docs-toc h4 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.docs-toc a { display: block; color: var(--muted); text-decoration: none; padding: 4px 10px; border-left: 2px solid var(--line); line-height: 1.35; }
.docs-toc a.l3 { padding-left: 22px; font-size: 12.5px; }
.docs-toc a:hover { color: var(--text); }
.docs-toc a.on { color: var(--text); border-left-color: var(--accent); }
.docs-prog { margin-top: 18px; height: 3px; border-radius: 2px; background: var(--side-2); overflow: hidden; }
.docs-prog i { display: block; height: 100%; width: 34%; background: var(--accent); }
.docs-toc-meta { margin-top: 18px; display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.docs-toc-meta div { display: flex; gap: 6px; align-items: center; min-width: 0; }

/* ----- старт / пустые состояния / заглушки ----- */
.docs-start { overflow-y: auto; padding: 56px; min-width: 0; }
.docs-start h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
.docs-start .sub { color: var(--muted); margin: 0 0 26px; }
.docs-start h5 { margin: 26px 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.docs-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; max-width: 900px; }
.docs-card { background: var(--side); border: 1px solid transparent; border-radius: 12px; padding: 14px 16px; color: var(--text); display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; min-width: 0; }
.docs-card:hover { border-color: var(--chip); background: var(--card); }
.docs-card .t { font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }
.docs-card .p { font: 11px var(--font-mono); color: var(--muted); }
.docs-card .x { font-size: 12.5px; color: var(--subtle); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.docs-card .f { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); min-width: 0; }
.docs-blank { display: grid; place-items: center; padding: 40px; flex: 1; min-height: 0; overflow-y: auto; }
.docs-blank .box { max-width: 480px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.docs-blank .ill { width: 72px; height: 72px; border-radius: 20px; background: var(--side); display: grid; place-items: center; color: var(--tint, var(--muted)); margin-bottom: 6px; }
.docs-blank .ill svg { width: 32px; height: 32px; }
.docs-blank h2 { margin: 0; font-size: 18px; font-weight: 600; }
.docs-blank p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.docs-blank code { font: 12px var(--font-mono); background: var(--side); padding: 1px 6px; border-radius: 6px; color: var(--subtle); }
.docs-blank .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.docs-blank .meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
.docs-blank .hint { font-size: 12px; margin-top: 4px; }
.docs-blank .lock-ill { color: var(--col-input); }

/* ----- просмотр кода ----- */
.docs-code { flex: 1; min-height: 0; overflow: auto; background: var(--code-bg); font: 13px/1.6 var(--font-mono); color: color-mix(in srgb, var(--text) 90%, var(--muted)); outline-offset: -2px; }
.docs-code-in { display: flex; min-width: max-content; min-height: 100%; }
.docs-code pre { margin: 0; font: inherit; }
.docs-code .gutter { position: sticky; left: 0; z-index: 1; flex-shrink: 0; padding: 12px 12px 12px 18px; min-width: 52px; text-align: right; color: color-mix(in srgb, var(--muted) 78%, transparent); background: var(--code-bg); border-right: 1px solid var(--line); user-select: none; }
.docs-code .src { padding: 12px 24px 12px 16px; tab-size: 2; }
.docs-code code { font: inherit; }
.docs-code mark, .doc-md mark { background: color-mix(in srgb, var(--col-input) 30%, transparent); color: inherit; border-radius: 3px; padding: 0; }
.docs-code mark.cur, .doc-md mark.cur { background: var(--col-input); color: #1e1d1b; }
.docs-code.hl .tk-c { color: #8f8c82; font-style: italic; }
.docs-code.hl .tk-s { color: #a9cdb2; }
.docs-code.hl .tk-k { color: #c3b4d6; }
.docs-code.hl .tk-n { color: #e0b68a; }
.docs-code.hl .tk-t { color: #a5c0d8; }
.docs-wrapnote { color: var(--muted); font-size: 12px; }

/* ----- статус-строка ----- */
.docs-status { display: flex; align-items: center; gap: 14px; min-height: 30px; padding: 4px 14px 4px 16px; border-top: 1px solid var(--line); background: var(--frame); color: var(--muted); font-size: 12px; flex-shrink: 0; white-space: nowrap; overflow: hidden; }
.docs-status .it { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.docs-status .it.path { font-family: var(--font-mono); font-size: 11.5px; color: var(--subtle); overflow: hidden; text-overflow: ellipsis; }
.docs-status .iso { color: var(--col-done); }
.docs-status b { color: var(--subtle); font-weight: 500; }
.docs-status .btn-text { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; height: 24px; }
.docs-status .btn-text:hover { color: var(--text); background: var(--side-2); }

/* ----- картинка ----- */

import { DOC_SNIFF_BYTES, DOC_TEXT_MAX_BYTES, docKindOf } from '../shared/docs-view'
import type { DocView } from '../shared/ipc'

/**
 * Просмотр файла проекта. Заглушки (бинарный, слишком большой, не UTF-8) — это
 * обычный результат, а не ошибка: человек выбрал файл и видит причину.
 */
export async function viewDoc(root: string, rel: string): Promise<DocView> {
  // единственный резолвер путей: \`..\`, симлинки наружу и \`.git\` отсекаются здесь
  const abs = await resolveProjectPath(root, rel)
  const info = await stat(abs)
  if (!info.isFile()) throw new OrcaError('files.notFile')

  const { kind, mime } = docKindOf(rel)
  const base = { size: info.size, mtime: info.mtimeMs, openable: isOpenable(rel, abs) }
  if (kind === 'pdf') return { ...base, kind, stub: 'pdf' }
  if (kind === 'image' || kind === 'html') return { ...base, kind, mime }
  if (info.size > DOC_TEXT_MAX_BYTES) return { ...base, kind, stub: 'tooBig' }

  const handle = await open(abs, 'r')
  try {
    // читаем не больше лимита + 1 байт: файл мог вырасти между stat и read
    const buf = Buffer.alloc(Math.min(info.size, DOC_TEXT_MAX_BYTES) + 1)
    const { bytesRead } = await handle.read(buf, 0, buf.length, 0)
    const bytes = buf.subarray(0, bytesRead)
    if (bytesRead > DOC_TEXT_MAX_BYTES) return { ...base, kind, stub: 'tooBig' }
    if (bytes.subarray(0, DOC_SNIFF_BYTES).includes(0)) return { ...base, kind: 'binary', stub: 'binary' }
    try {
      const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes)
      return { ...base, kind, text: text.replace(/^\\uFEFF/, '') }
    } catch {
      return { ...base, kind, stub: 'notUtf8' }
    }
  } finally {
    await handle.close()
  }
}

function isOpenable(rel: string, abs: string): boolean {

  return SHOWCASE_FILE_TYPES[extOf(rel)] !== undefined && SHOWCASE_FILE_TYPES[extOf(abs)] !== undefined
}`;

function highlight(src) {
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)|\b(import|from|export|async|function|const|let|if|return|throw|await|new|type|try|catch|finally|void)\b|\b(\d+)\b|\b([A-Z][A-Za-z0-9]+)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) { out += esc(src.slice(last, m.index)); const c = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'n' : 't'; out += `<span class="tk-${c}">${esc(m[0])}</span>`; last = re.lastIndex; }
  return out + esc(src.slice(last));
}

function model() {

  const m = { S, t, p, f, render: 'start', stub: t.stub || null, err: t.err || null };

  if (!f) return m;
  if (t.stub) { m.render = 'stub'; m.kind = f.k; m.openable = t.stub === 'pdf' || t.stub === 'bigimg'; return m; }
  m.kind = f.k; m.openable = OPENABLE(f);
  if (f.k === 'img') m.render = 'image';
  else if (f.k === 'md') m.render = UI.md === 'doc' ? 'md' : 'code';
  else if (f.k === 'html') m.render = UI.html === 'code' ? 'code' : 'preview';
  else m.render = 'code';
  m.codeText = f.k === 'md' ? MD_SRC : f.k === 'html' ? HTML_SRC : f.k === 'cfg' && /\.json$/.test(f.p) ? SAMPLES.json : f.k === 'cfg' && /\.ya?ml$/.test(f.p) ? SAMPLES.yml : f.k === 'env' || f.p === '.env.example' ? SAMPLES.env : /\.css$/.test(f.p) ? SAMPLES.css : f.k === 'txt' ? SAMPLES.txt : CODE_TS;
  m.lines = m.codeText.split('\n').length;

}

/* ===== Общие помощники для вариантов ===== */
const dvWidth = () => { const d = $('#dv'); return d ? d.clientWidth : UI.width; };
const docsHeadHTML = () => `<div class="docs-head"><h3>${ic('doc')}Документы <span class="proj">· orca-board</span></h3><span class="docs-grow"></span><span class="docs-keys"><kbd>⌘P</kbd> файл · <kbd>⌘F</kbd> в тексте</span><button class="icon-btn" data-do="refresh" title="Обновить список" aria-label="Обновить список">${icS('refresh')}</button><button class="icon-btn" data-do="close" title="Закрыть (Esc)" aria-label="Закрыть">${ic('close')}</button></div>`;
const ibAct = (act, ico, title, cls = '') => `<button class="icon-btn ${cls}" data-act="${act}" title="${title}" aria-label="${title}">${icS(ico)}</button>`;
const navBtns = () => `<button class="icon-btn" data-do="back" title="Назад (⌘[)" aria-label="Назад" ${HIST.i <= 0 ? 'disabled' : ''}>${icS('back')}</button><button class="icon-btn" data-do="forward" title="Вперёд (⌘])" aria-label="Вперёд" ${HIST.i >= HIST.stack.length - 1 ? 'disabled' : ''}>${icS('forward')}</button>`;
function pathHTML(m, { dirs = true } = {}) {
  const parts = m.p.split('/'), d = parts.slice(0, -1);
  return `<div class="docs-path" title="${esc(m.p)}"><span class="src">Проект</span>${dirs ? d.map((s, i) => `<span class="sep">/</span><button class="seg" data-do="revealdir" data-dirp="${esc(d.slice(0, i + 1).join('/'))}" title="Показать папку в дереве">${esc(s)}</button>`).join('') : ''}<span class="sep">/</span><span class="cur">${esc(nameOf(m.p))}</span></div>`;
}
/* строка статуса: факты о файле слева, пометки справа */
function statusHTML(m, { path = false, actions = false } = {}) {
  if (!m.f || m.render === 'start' || m.render === 'stale' || m.render === 'stub') return '';
  const fs = facts(m), f = m.f;
  const it = ([k, v], i) => `<span class="it ${i >= 3 ? 'opt' : ''}">${k === 'Тип' ? `<b>${esc(v)}</b>` : k === 'Размеры' || k === 'Кодировка' ? esc(v) : k === 'Строк' ? `${v} ${v % 10 === 1 && v !== 11 ? 'строка' : [2, 3, 4].includes(v % 10) && ![12, 13, 14].includes(v % 100) ? 'строки' : 'строк'}` : k === 'Чтение' ? esc(v) : k === 'Изменён' ? `${icS('clock')}изменён ${esc(v)}` : esc(v)}</span>`;
  const iso = m.render === 'preview' || (m.kind === 'html' && UI.html === 'preview') ? `<span class="it iso">${icS('lock')}изолировано, без сети</span>` : '';
  const zoom = m.render === 'image' ? `<span class="it">${UI.img === 'fit' ? 'вписано · 62 %' : '100 %'}</span>` : '';
  const wrap = m.render === 'code' ? '<span class="it opt">без переноса</span>' : '';
  return `<div class="docs-status" role="status" aria-label="Сведения о файле">${path ? `<button class="btn-text it path" data-act="copy" title="Копировать путь">${esc(m.p)}</button>` : ''}${fs.map(it).join('')}${zoom}${iso}${wrap}<span class="docs-grow"></span>${VAR.statusExtra ? VAR.statusExtra(m) : ''}${actions ? `<button class="btn-text" data-act="copy" aria-label="Копировать путь">${icS('copy')}<span class="lbl">Копировать путь</span></button><button class="btn-text" data-act="reveal" aria-label="Показать в Finder">${icS('reveal')}<span class="lbl">Показать в Finder</span></button>${m.openable ? `<button class="btn-text" data-act="open" aria-label="Открыть в приложении системы">${icS('external')}<span class="lbl">Открыть</span></button>` : ''}` : ''}</div>`;
}
/* перерисовка по клику «показать папку в дереве» */
function revealDir(p) { UI.mode = 'tree'; UI.q = ''; ancestors(p + '/x').forEach((a) => OPEN.add(a)); VAR.onReveal && VAR.onReveal(); render(); setTimeout(() => { const r = $(`[data-dir="${CSS.escape(p)}"]`) || $$('[data-dir]').reverse().find((n) => p.startsWith(n.dataset.dir)); r && r.scrollIntoView({ block: 'nearest' }); }, 0); }

/* меню «⋯»: действия с файлом (узкое окно — вместо отдельных кнопок) */
function menuHTML(m, top = 52) {
  if (!UI.menu || !m.f || m.render === 'start' || m.render === 'stale') return '';
  const it = (act, ico, t, hint = '') => `<button class="popup-menu-item" role="menuitem" data-act="${act}">${icS(ico)}<span>${t}</span>${hint ? `<span class="popup-menu-hint">${hint}</span>` : ''}</button>`;
  return `<div class="popup-menu" role="menu" aria-label="Действия с файлом" style="right:12px;top:${top}px">${it('copy', 'copy', 'Копировать путь', '⌘⇧C')}${it('copyabs', 'copy', 'Копировать абсолютный путь')}<div class="popup-menu-sep"></div>${it('reveal', 'reveal', 'Показать в Finder')}${m.openable ? it('open', 'external', 'Открыть в приложении системы') : `<div class="popup-menu-item" role="menuitem" aria-disabled="true">${icS('external')}<span>Открыть — недоступно для этого типа</span></div>`}</div>`;
}
const moreBtn = (m, cls = '') => (!m.f || m.render === 'start' || m.render === 'stale' ? '' : `<button class="icon-btn ${cls}" data-do="menu" aria-haspopup="menu" aria-expanded="${UI.menu}" title="Действия с файлом" aria-label="Действия с файлом">${icS('more')}</button>`);

/* состояние «Вход»: приложение без вкладки «Файлы»; окно открывается кнопкой «Документы» в левой панели */
function entryHTML() {
  const rail = (n, t, on = false, extra = '') => `<button class="en-icon ${on ? 'target' : ''}" ${on ? 'data-do="opendocs"' : ''} title="${t}" aria-label="${t}" ${on ? '' : 'tabindex="-1"'}>${ic(n)}${extra}</button>`;
  const col = (c, t, n) => `<div class="en-col"><div class="en-col-h"><span class="docs-dot" style="background:${c}"></span>${t}<span class="n">${n}</span></div><div class="en-card"></div><div class="en-card s"></div></div>`;
  return `<div class="en-app" aria-label="Главное окно приложения (макет)">
    <nav class="en-rail" aria-label="Левая панель">${rail('folder', 'Проекты')}${rail('gear', 'Настройки')}${rail('doc', 'Документы', true, '<span class="en-n">1</span>')}</nav>
    <aside class="en-side"><h2>Проекты</h2><div class="en-proj on"><div class="nm">orca-board</div><div class="sub">~/project/orca-board</div></div><div class="en-proj"><div class="nm">md-audit-backend</div><div class="sub">~/work/backend</div></div></aside>
    <main class="en-main"><header><h1>orca-board</h1><div class="en-tabs" role="tablist" aria-label="Вкладки проекта"><span class="en-tab on">Канбан</span><span class="en-tab">Терминалы <i>2</i></span><span class="en-gone"><span class="en-tab gone" title="Вкладка убрана">Файлы</span><b class="en-n">2</b></span><span class="en-tab">Статистика</span><span class="en-tab">О проекте</span></div></header>
      <div class="en-board">${col('var(--col-backlog)', 'Бэклог', 4)}${col('var(--col-progress)', 'В работе', 2)}${col('var(--col-input)', 'Нужен ввод', 1)}${col('var(--col-review)', 'Ревью', 3)}</div>
      <div class="en-legend"><p><b class="en-n">1</b> Единственный вход — кнопка «Документы» в левой панели. Дерево, поиск и просмотр всех файлов проекта — в одном окне.</p><p><b class="en-n">2</b> Вкладки «Файлы» больше нет; сохранённая вкладка откроет «Канбан». Подсказка «Открыть в “Документах”» из неё тоже не нужна.</p><button class="btn-sm primary" data-do="opendocs">${icS('doc')}Открыть «Документы»</button></div>
    </main></div>`;
}

/* ===== Вариант 3 — «Фокус»: одна полоса сверху, выдвижное дерево, палитра ⌘P, сведения и действия в строке статуса ===== */
UI.recentOpen = true;
const REC_ORDER = ['14:32', '14:41', '14:50', 'вчера', '21.09', '18.09', '17.09', '15.09', '10.09', '05.09', '03.09', '02.09', '01.07'];
const recRank = (t) => { const i = REC_ORDER.indexOf(t); return i < 0 ? 99 : i; };
const recentList = () => [...visibleFiles()].sort((a, b) => recRank(a.t) - recRank(b.t));

function headV3(m) {
  const has = m.f && m.render !== 'stale' && m.render !== 'start';
  const md = has && m.kind === 'md' && m.render !== 'stub';
  return `<div class="docs-head v3-head">
    <button class="icon-btn ${UI.drawer ? 'on' : ''}" data-do="drawer" title="Дерево файлов" aria-label="Дерево файлов" aria-expanded="${UI.drawer}" aria-controls="v3-drawer">${ic('sidebar')}</button>
    ${has ? navBtns() : ''}
    ${has ? pathHTML(m) : `<h3>${ic('doc')}Документы <span class="proj">· orca-board</span></h3>`}
    <span class="docs-grow"></span>
    <span class="docs-ctl">${viewCtl(m)}${md ? `<button class="icon-btn ${UI.toc ? 'on' : ''}" data-do="toc" title="Закрепить оглавление" aria-label="Закрепить оглавление" aria-pressed="${UI.toc}">${icS('toc')}</button>` : ''}</span>
    <button class="v3-pal-btn" data-do="pal" aria-haspopup="dialog" title="Найти файл (⌘P)" aria-label="Найти файл по всему проекту">${icS('search')}<span class="lbl">Найти файл…</span><kbd>⌘P</kbd></button>
    <button class="icon-btn" data-do="refresh" title="Обновить список" aria-label="Обновить список">${icS('refresh')}</button>
    <button class="icon-btn" data-do="close" title="Закрыть (Esc)" aria-label="Закрыть">${ic('close')}</button>
  </div>`;
}
function drawerHTML() {
  const rec = recentList().slice(0, 5);
  return `<aside class="docs-tree v3-drawer" id="v3-drawer" aria-label="Файлы проекта">
    ${T[S].trunc ? truncHTML() : ''}
    <div class="docs-tree-body">
      <button class="v3-fold" data-do="recent" aria-expanded="${UI.recentOpen}"><svg class="i s docs-chev" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(${UI.recentOpen ? 90 : 0}deg)">${P.chev}</svg>Недавние<span class="n">${rec.length}</span></button>
      ${UI.recentOpen ? rec.map((f) => fileRow(f, 0, `${esc(nameOf(f.p))}${f.p.includes('/') ? `<span class="docs-row-dir">${esc(dirOf(f.p))}</span>` : ''}`)).join('') : ''}
      <div class="docs-grp">Проект<span class="n">${projectCount()}</span></div>
      <div role="tree" aria-label="Файлы проекта">${nodesHTML(buildTree(visibleFiles()), 0)}</div>
      ${tasksHTML()}
    </div>
    <div class="docs-tree-foot v3-drawer-foot"><button class="btn-text" data-do="pal">${icS('search')}Поиск по проекту <kbd>⌘P</kbd></button></div>
  </aside>`;
}
function palBodyHTML() {
  if (UI.q.trim()) return treeBodyHTML();
  const rec = recentList().slice(0, 9);
  return `<div class="docs-grp">Недавние<span class="n">последние 200</span></div><div role="listbox" aria-label="Недавние файлы">${rec.map((f, i) => hitRow({ f, mt: { ranges: [] } }, i)).join('')}</div>${T[S].trunc ? `<div class="docs-more"><b>Список обрезан:</b> показаны первые 100 000 файлов проекта.</div>` : ''}<div class="docs-hint" style="padding:8px">Начните вводить путь — поиск идёт по всему проекту.</div>`;
}
function palHTML() {
  if (!UI.palette) return '';
  return `<div class="v3-scrim2" data-do="palclose"></div><div class="v3-pal" role="dialog" aria-modal="true" aria-label="Поиск файла"><div class="v3-pal-in">${ic('search', 's')}<input data-in="pal" value="${esc(UI.q)}" placeholder="Найти файл по пути…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-label="Найти файл по пути"><kbd>Esc</kbd></div><div class="v3-pal-body" id="pal-list" data-slot="results">${palBodyHTML()}</div><div class="v3-pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> выбрать</span><span><kbd>↵</kbd> открыть</span><span><kbd>Esc</kbd> закрыть</span></div></div>`;
}
const outlineHTML = () => `<nav class="v3-outline ${UI.toc ? 'pin' : ''}" aria-label="Оглавление" tabindex="0"><div class="ticks" aria-hidden="true">${TOC.map(([, , l], i) => `<i class="${l === 3 ? 's' : ''} ${i === 1 ? 'on' : ''}"></i>`).join('')}</div><div class="panel"><h4>На странице</h4>${tocHTML()}</div></nav>`;
function mainV3(m) {
  const body = m.render === 'start' ? startHTML() : m.render === 'stale' ? staleHTML() : viewerBody(m);
  return `<section class="docs-pane v3-pane">${findBarHTML(m)}${body}${m.render === 'md' ? outlineHTML() : ''}${statusHTML(m, { path: true, actions: true })}</section>`;
}
const V3 = {
  iconStyle: 'ext',
  resultsHTML: palBodyHTML,
  paletteFor: (id) => id === 'search' || id === 'recent',
  focusSearch() { UI.palette = true; UI.q = ''; UI.kb = 0; render(); const i = $('[data-in="pal"]'); i && i.focus(); },
  palEmptyList: () => recentList().slice(0, 9).map((f) => ({ f })),
  escape() { if (UI.palette) { UI.palette = false; UI.q = ''; render(); } else if (UI.drawer && dvWidth() <= 1100) { UI.drawer = false; render(); } },
  onWidth() { UI.drawer = UI.width > 1100; },
  onReveal() { UI.drawer = true; },
  statusExtra(m) { return m.hlOK && m.render === 'code' ? `<button class="v3-sw" role="switch" aria-checked="${UI.hl}" data-do="hl" title="Подсветка синтаксиса (опция)"><i></i>Подсветка</button>` : ''; },
  render(m) {
    return headV3(m) + `<div class="v3-main ${UI.drawer ? 'd-open' : ''}">${drawerHTML()}<div class="v3-scrim" data-do="drawer"></div>${mainV3(m)}</div>${palHTML()}`;
  },
  doDo(a) {
    if (a === 'drawer') { UI.drawer = !UI.drawer; render(); }
    else if (a === 'pal') this.focusSearch();
    else if (a === 'palclose') { UI.palette = false; UI.q = ''; render(); }
    else if (a === 'recent') { UI.recentOpen = !UI.recentOpen; render(); }
    else if (a === 'toc') { UI.toc = !UI.toc; render(); }
    else if (a === 'hl') { UI.hl = !UI.hl; sync(); render(); }
  },
  after() { if (UI.palette && !(document.activeElement && document.activeElement.dataset.in === 'pal')) { const i = $('[data-in="pal"]'); i && i.focus(); } }
};
init(V3, 'Вариант 3 — фокус и палитра ⌘P');


</script>
</body>
</html>
