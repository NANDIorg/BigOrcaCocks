appId: dev.orca-board
productName: orca-board
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../../packages/cli/bin
    to: cli
    filter: ['**/*']
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: true
