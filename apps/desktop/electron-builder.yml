appId: dev.orca-board
productName: orca-board
directories:
  output: release
# Метаданные обновлений; файлы публикует только job draft после финальных проверок.
beforePack: ./build/macos-release-hooks.mjs
artifactBuildCompleted: ./build/macos-release-hooks.mjs
publish:
  provider: github
  owner: NANDIorg
  repo: BigOrcaCocks
  releaseType: draft
files:
  - out/**
  - package.json
extraResources:
  - from: ../../packages/cli/bin
    to: cli
    filter: ['**/*']
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip нужен автообновлению: dmg подменить на месте нельзя, приложение качает zip
    # по latest-mac.yml своим установщиком.
    - target: zip
      arch: [arm64, x64]
  type: distribution
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  sign: true
  # v26.15.3: DMG будет изменён stapling; updater использует только ZIP.
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
npmRebuild: true
