appId: dev.orca-board
productName: orca-board
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../../packages/cli/bin
    to: cli
    filter: ['**/*']
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
npmRebuild: true
