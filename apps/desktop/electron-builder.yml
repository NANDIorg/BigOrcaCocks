appId: dev.orca-board
productName: orca-board
directories:
  output: release
# Релизы — GitHub Releases публичного репозитория. releaseType: draft — публикация создаёт черновик,
# человек проверяет файлы и жмёт Publish сам. Токен (GH_TOKEN) в конфиг не кладём: он нужен
# только скрипту `dist:publish`, обычный `dist` собирает с `--publish never`.
publish:
  provider: github
  owner: NANDIorg
  repo: BigOrcaCocks
  releaseType: draft
files:
  - out/**
  - package.json
extraResources:
  - from: ../../packages/cli/bin
    to: cli
    filter: ['**/*']
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip нужен автообновлению: dmg подменить на месте нельзя, приложение качает zip
    # по latest-mac.yml. Squirrel.Mac при ad-hoc подписи не работает, но сам zip нужен и своему установщику.
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc подпись: без неё скачанный браузером .app (карантин) на Apple Silicon macOS
  # называет «повреждённым» и не даёт открыть. Нотаризации нет — Developer ID не нужен.
  # hardenedRuntime выключен: с ним library validation отвергает Electron Framework,
  # подписанный ad-hoc (другой Team ID), и приложение падает при запуске.
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
npmRebuild: true
