# Внутренний proxy контейнера. Orca слушает только 127.0.0.1 и в режиме proxy принимает
# запросы лишь с loopback, поэтому внешний reverse proxy обращается к этим портам.
# Host и X-Forwarded-Proto передаются от внешнего proxy без изменений: Orca сама сверяет их
# с origin из config.json и отклоняет запросы без HTTPS.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # Вложения: до 25 MiB на файл, проверку выполняет Orca.
  client_max_body_size 32m;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  # Long polling потоков и терминалов.
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  server {
    listen 8080;
    location / { proxy_pass http://127.0.0.1:3737; }
  }

  server {
    listen 8081;
    location / {
      # proxy_set_header уровня location отменяет наследование из http: повторяем все заголовки.
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Cookie "";
      proxy_pass http://127.0.0.1:3738;
    }
  }
}
